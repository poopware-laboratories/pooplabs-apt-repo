name: Publish APT feed

on:
  push:
    branches:
      - main
    paths:
      - 'debs/*.deb'
      - 'upstream.json'
      - 'CydiaIcon.png'
      - 'scripts/**'
      - '.github/workflows/publish-apt.yml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.build.outputs.changed }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Ensure Debian package tools are installed
        run: |
          command -v dpkg-scanpackages >/dev/null || {
            sudo apt-get update
            sudo apt-get install -y dpkg-dev
          }

      - name: Build APT feed
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: scripts/build-feed.sh

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    # The hourly refresh only deploys when the package index actually changed.
    if: github.event_name != 'schedule' || needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
